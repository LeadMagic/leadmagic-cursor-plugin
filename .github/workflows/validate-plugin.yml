name: Validate Cursor Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".cursor-plugin/**"
      - ".github/**"
      - ".gitignore"
      - ".node-version"
      - "assets/**"
      - "mcp.json"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "SUBMISSION.md"
      - "rules/**"
      - "agents/**"
      - "commands/**"
      - "schemas/**"
      - "scripts/**"
      - "CHANGELOG.md"
      - "skills/**"
      - "SECURITY.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # GitHub never re-creates a cancelled run, so a superseded main commit would be
  # left with no result. Only PR runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high or critical)
        run: npm audit --audit-level=high

      - name: Validate plugin and hosted health
        run: npm run check
